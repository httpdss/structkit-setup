name: Test Action

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  setup:
    name: Setup ${{ matrix.structkit-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        structkit-version: [latest, '3.3.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up StructKit
        id: setup
        uses: ./
        with:
          structkit-version: ${{ matrix.structkit-version }}

      - name: Show outputs
        shell: bash
        run: |
          echo "version=${{ steps.setup.outputs.version }}"
          echo "cache-hit=${{ steps.setup.outputs.cache-hit }}"
          test -n "${{ steps.setup.outputs.version }}" || (echo "version output is empty" && exit 1)

      - name: Verify generate help
        shell: bash
        run: structkit generate --help

  cache-hit:
    name: Cache hit ${{ matrix.structkit-version }} on ${{ matrix.os }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        structkit-version: [latest, '3.3.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up StructKit
        id: setup
        uses: ./
        with:
          structkit-version: ${{ matrix.structkit-version }}

      - name: Assert cache-hit
        shell: bash
        run: |
          echo "version=${{ steps.setup.outputs.version }}"
          echo "cache-hit=${{ steps.setup.outputs.cache-hit }}"
          if [[ "${{ steps.setup.outputs.cache-hit }}" != "true" ]]; then
            echo "::error::Expected cache-hit=true, got '${{ steps.setup.outputs.cache-hit }}'"
            exit 1
          fi

      - name: Verify generate help
        shell: bash
        run: structkit generate --help
